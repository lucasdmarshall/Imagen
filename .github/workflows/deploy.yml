name: CI/CD

# Push to main  -> run CI, then auto-deploy to the server over SSH.
# Pull requests -> run CI only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Go API ----
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/api/go.sum
      - name: Go vet & build
        working-directory: backend/api
        run: |
          go vet ./...
          go build ./...

      # ---- Python AI service ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install & import-check AI service
        working-directory: backend/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app.main; print('AI service imports OK')"

      # ---- Compose sanity ----
      - name: Validate docker-compose
        run: docker compose config -q

  deploy:
    name: Deploy to server
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
